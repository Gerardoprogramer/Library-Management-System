<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; color: #333; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; }
        h1 { color: #007BFF; }
        p { line-height: 1.5; }
        a.button { display: inline-block; padding: 10px 20px; background: #007BFF; color: #fff; text-decoration: none; border-radius: 5px; }
        .footer { font-size: 12px; color: #888; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>Restablece tu contraseña</h1>
    <p>Hola <strong th:text="${userName}">Usuario</strong>,</p>
    <p>Recibimos una solicitud para restablecer tu contraseña. Haz clic en el botón a continuación para continuar:</p>
    <p><a class="button" th:href="${resetLink}">Restablecer Contraseña</a></p>
    <p>Si no solicitaste este cambio, ignora este correo.</p>
    <div class="footer">Library Management System &copy; 2026</div>
</div>
</body>
</html>
